[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reeve"
version = "0.1.41"
description = "Lifetime persistent memory for LLMs. A lightweight SDK for structured knowledge graphs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ankesh Kumar" },
]
keywords = [
    "memory",
    "neo4j",
    "knowledge-graph",
    "openai",
    "embeddings",
    "long-term-memory",
    "personal-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "neo4j>=5.0",
    "langchain>=0.2",
    "langchain-ollama>=0.2",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "PyJWT>=2.0",
    "starlette>=0.30.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0",
    "requests>=2.25.0",
    "sseclient-py>=1.7.2",
    "razorpay>=1.4.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.1", "openai>=1.0"]
streamlit = ["streamlit>=1.30"]
# Supports FastMCP and MCPServer server layouts
mcp = [
    "mcp>=1.6",
    "uvicorn>=0.20.0",
    "supabase>=2.0.0",
    "pillow>=10.0",
    "boto3>=1.34",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
reeve = "threelane_memory.cli:main"
reeve-mcp = "threelane_memory.mcp_server:main"

[tool.setuptools.packages.find]
include = ["threelane_memory*", "reeve*"]

[tool.setuptools.package-data]
threelane_memory = ["static/*"]
reeve = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require API keys and external services",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
